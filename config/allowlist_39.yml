# Live-only P1 probe artifact for league 39 (Premier League).
#
# Seeded from the confirmed data-collection window (2010-2026 retrievable,
# 2007-2009 dead) previously held in data/raw/probe_39.json,
# seasons_allowlist_39.json and dead_seasons_39.json. `data:probe_pl39`
# (Pl39Probe) owns this file: each run costs up to 10 live
# `teams?league=39&season` requests (0.6s throttle, no response cache) and
# merges the probed window into this file, preserving seasons outside the
# window. Backfill refuses any season not on `allowlist` (or past present).
---
league: 39
present_year: 2026
window_truncated: false
allowlist:
