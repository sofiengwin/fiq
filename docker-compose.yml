
services:
  app:
    build:
      context: .
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails server -b '0.0.0.0' -p 3000"
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL_SIDEKIQ=redis://redis:6379/1
    env_file:
      - .env
    volumes:
      - '.:/rails'
    depends_on:
      - redis
      - postgres
    labels:
      logging: "app"
      job: "app"
      app: "app"

  redis:
    image: redis:7
    command: redis-server
    ports:
      - 6379:6379
    volumes:
      - redis:/data
    labels:
      logging: "redis"
      job: "redis"
      app: "redis"

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: fiq_development
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: password
    volumes:
     - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      logging: "postgres"
      job: "postgres"
      app: "postgres"

  sidekiq:
    build:
      context: .
    volumes:
      - .:/rails
    command: bash -c "bundle exec sidekiq"
    environment:
      - REDIS_URL_SIDEKIQ=redis://redis:6379/1
    env_file:
      - .env
    depends_on:
      - app
      - postgres
      - redis
    labels:
      logging: "sidekiq"
      job: "sidekiq"
      app: "sidekiq"

volumes:
  redis:
  postgres: