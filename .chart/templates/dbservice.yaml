apiVersion: v1
kind: Service
metadata:
  name: external-local-db
spec:
  ports:
    - protocol: TCP
      port: 5432       # The port your app will use inside the cluster
      targetPort: 5432
---
apiVersion: v1
kind: Endpoints
metadata:
  name: external-local-db
subsets:
  - addresses:
      - ip: 192.168.1.5 # The local network IP of your database
    ports:
      - port: 5432