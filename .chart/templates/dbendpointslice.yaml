apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: external-local-db-postgres # Name should ideally be service-name + suffix
  labels:
    kubernetes.io/service-name: external-local-db # REQUIRED: Matches the Service name
addressType: IPv4
ports:
  - port: 5432
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.1.5 # The local network IP of your database
    conditions:
      ready: true    # Important: Tells K8s this destination is active